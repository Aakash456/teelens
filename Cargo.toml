[package]
name = "teelens"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Preflight checks for confidential Kubernetes workloads"

[[bin]]
name = "teelens"
path = "src/main.rs"

[[bin]]
name = "kubectl-teelens"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
toml = "0.8"
